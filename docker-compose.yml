services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lela
      POSTGRES_PASSWORD: lela_password
      POSTGRES_DB: lela_school
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lela -d lela_school"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: http://localhost:4173
      JWT_SECRET: replace-with-a-long-random-secret
      DATABASE_URL: postgresql://lela:lela_password@postgres:5432/lela_school?schema=public
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "4173:4173"
    depends_on:
      - api

volumes:
  postgres-data:
